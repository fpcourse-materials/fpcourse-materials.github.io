project:
  type: website
  output-dir: ../site
  render:
    - '**/*.qmd'
  resources:
    - '2026/**/*.html'
    - '2026/**/*.pdf'
    - publication.json
    - favicon.svg
website:
  title: "ФП · материалы курса"
  site-url: https://fpcourse-materials.github.io
  description: "Слайды, конспекты, упражнения и домашние задания по функциональному программированию."
  favicon: favicon.svg
  navbar:
    title: "ФП / материалы"
    background: light
    left:
      - href: 2026/fp1/index.qmd
        text: ФП 1
      - href: 2026/fp2/index.qmd
        text: ФП 2
    right:
      - href: https://github.com/fpcourse-materials
        icon: github
        text: GitHub
  search:
    location: navbar
    type: overlay
  bread-crumbs: true
  page-footer:
    left: "Функциональное программирование · материалы курса"
    right:
      - text: "Сообщить об ошибке"
        href: https://github.com/fpcourse-materials/fpcourse-materials.github.io/issues
format:
  html:
    lang: ru
    theme: [cosmo, theme.scss]
    toc: true
    toc-title: На этой странице
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    respect-user-color-scheme: false
    date-format: "DD.MM.YYYY"
